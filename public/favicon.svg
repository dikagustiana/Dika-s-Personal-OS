<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Browser favicon. The lantern path data is the mark's, untouched; the
       group only centres it in a square canvas and fills it as far as the
       plate's corner radius allows, which is what keeps the orange flame a
       saturated pixel rather than a brown smudge at 16px. The plate carries
       the app canvas colour so the navy silhouette also reads against dark
       browser chrome. -->
  <rect width="64" height="64" rx="10" fill="#F2F5F7"/>
  <g transform="translate(-4.48 3.5) scale(1.14)">
    <path d="M8 14 Q8 2 32 2 Q56 2 56 14 L48 44 L16 44 Z" fill="#002147"/>
    <rect x="16" y="44" width="32" height="4" rx="1" fill="#002147"/>
    <path d="M32 30 Q26 38 32 42 Q38 38 32 30 Z" fill="#EB7300"/>
  </g>
</svg>
