<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches --background (#F2F5F7). The app is light-only by design;
         there is no dark class and no theme toggle. -->
    <meta name="theme-color" content="#F2F5F7" />
    <!-- SPLIT BY SIZE, NOT BY PREFERENCE. The logo everywhere else in the app
         is the owner's photograph; here the two tab icons stay the derived
         mark, because a browser tab renders them at 16 CSS pixels and the
         photograph does not survive it — rendered at that size the figure and
         the raised arms dissolve and it reads as an orange-and-blue square.
         The mark is still a lantern with a lit flame at 16px, which is the
         whole reason it exists. Both tab icons carry the SAME mark on purpose:
         an identity that changes between browsers is not an identity.
         The photograph does read at 180px, so apple-touch-icon below is the
         photograph. SVG first for sharpness at any tab size; the 32px PNG is
         the fallback for clients that ignore SVG icons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- The photograph, generated at 180px straight from src/lantern.png in a
         single resample — not upscaled from the 32px icon. Full-bleed and
         square-cornered because iOS and Android apply their own mask; adding
         a radius here would show through theirs as a double corner. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Personal OS — a private daily command center for focused work and deliberate growth."
    />
    <title>Personal OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
