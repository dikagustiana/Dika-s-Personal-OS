<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches --background (#F2F5F7). The app is light-only by design;
         there is no dark class and no theme toggle. -->
    <meta name="theme-color" content="#F2F5F7" />
    <!-- The lantern mark. SVG first for sharpness at any tab size; the 32px
         PNG is the fallback for clients that ignore SVG icons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Personal OS — a private daily command center for focused work and deliberate growth."
    />
    <title>Personal OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
